name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and NDK
        run: |
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platforms;android-33" "build-tools;33.0.2" "ndk;${NDK_VERSION}"

      - name: Export NDK path
        run: |
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/moge-app

      - name: Run core tests
        run: cargo test --workspace

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build APK
        working-directory: crates/moge-app
        run: cargo apk build

      - uses: actions/upload-artifact@v4
        with:
          name: MOGE-apk
          path: crates/moge-app/target/debug/apk/*.apk
          if-no-files-found: error
