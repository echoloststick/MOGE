name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and NDK
        run: |
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platforms;android-33" "build-tools;33.0.2" "ndk;${NDK_VERSION}"

      - name: Export NDK path
        run: |
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/moge-app
            crates/moge-luau

      - name: Run core tests
        run: cargo test --workspace

      - name: Download the Roblox API dump (embedded in the app; the app also downloads it at runtime if this fails)
        run: |
          mkdir -p crates/moge-app/assets
          curl -fsSL --retry 3 -o crates/moge-app/assets/Full-API-Dump.json https://raw.githubusercontent.com/MaximumADHD/Roblox-Client-Tracker/roblox/Full-API-Dump.json || rm -f crates/moge-app/assets/Full-API-Dump.json

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Remove stale examples (cargo-apk would package each one as its own APK)
        run: rm -rf crates/moge-app/examples

      - name: Test the Luau runtime (mlua)
        working-directory: crates/moge-luau
        continue-on-error: true
        run: cargo test

      - name: Build APK (with Luau)
        id: apk
        continue-on-error: true
        working-directory: crates/moge-app
        run: cargo apk build

      - name: Build APK without Luau (fallback, only runs if the build above failed)
        if: steps.apk.outcome == 'failure'
        working-directory: crates/moge-app
        run: |
          echo "::warning::The Luau build failed, so this APK has NO script execution. Send the log of the previous step."
          cargo apk build --no-default-features

      - uses: actions/upload-artifact@v4
        with:
          name: MOGE-apk
          path: crates/moge-app/target/debug/apk/*.apk
          if-no-files-found: error
