# Standalone workspace: keeps the std-only crates buildable offline and gives cargo-apk its own lockfile.
[workspace]

[package]
name = "moge-app"
version = "0.1.0"
edition = "2021"

[features]
default = ["luau"]
luau = ["dep:moge-luau"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
moge-core = { path = "../moge-core" }
moge-formats = { path = "../moge-formats" }
moge-gui = { path = "../moge-gui" }
moge-math = { path = "../moge-math" }
moge-roblox = { path = "../moge-roblox" }
moge-scene = { path = "../moge-scene" }
moge-script = { path = "../moge-script" }
moge-luau = { path = "../moge-luau", optional = true }
winit = { version = "0.30", features = ["android-native-activity"] }
wgpu = "22"
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.29", default-features = false }
ureq = "2"
webbrowser = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.3"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"

# cargo-apk refuses release builds without a keystore, so the dev profile is optimized instead.
[profile.dev]
opt-level = 3
debug = false

[package.metadata.android]
package = "com.studiomobi.moge"
apk_name = "MOGE"
build_targets = ["aarch64-linux-android"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.application]
label = "MOGE"
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "landscape"
